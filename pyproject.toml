[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actc"
version = "0.1.0"
description = "Planning and MPC stack for closed-loop autonomous racing in Assetto Corsa"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "osqp>=0.6",
  "casadi>=3.6",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "matplotlib>=3.8",
]
windows = [
  "vgamepad>=0.1.0",
  "psutil>=5.9",
]

[project.scripts]
actc = "actc.cli:main"

[tool.setuptools.packages.find]
include = ["actc*"]
